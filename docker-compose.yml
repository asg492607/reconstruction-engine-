version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rre_user
      POSTGRES_PASSWORD: rre_password
      POSTGRES_DB: rre_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: rre-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    container_name: rre-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://rre_user:rre_password@postgres:5432/rre_db
      - STORAGE_BACKEND=MINIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=rre-evidence
      - MINIO_SECURE=False
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
